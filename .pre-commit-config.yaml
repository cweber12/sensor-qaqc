# Harvested from ioos-python-package-skeleton and trimmed per #1:
# dropped interrogate (docstring-presence checking is what it was rejected
# for), blackdoc and nbqa-black (two formatters alongside ruff-format),
# nbqa-* and nb-strip-paths (no notebooks until #9), requirements-txt-fixer
# and file-contents-sorter (no requirements files), add-trailing-comma and
# sort-all (ruff-format and RUF022 cover both).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The largest legitimate artifact is the 84 kB sample export under
        # docs/data/; 200 kB leaves headroom for a longer deployment's export
        # while still catching an accidental data or output commit.
        args: ["--maxkb=200"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Both rewrite files in place, which is wrong for a fixture whose bytes
      # are the test. `Stop When Memory Fills ` carries a trailing space in
      # Onset's own export - stripping it silently deletes the quirk the
      # reader is tested against, and only tests/test_fixture_hashes.py
      # noticed. Fixture directories are byte-exact by .gitattributes (-text)
      # for the same reason; these hooks have to respect that too.
      - id: end-of-file-fixer
        exclude: ^(tests|docs)/data/
      - id: trailing-whitespace
        exclude: ^(tests|docs)/data/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.27.0
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
