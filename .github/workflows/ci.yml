# Four jobs (#1): lint fails fast with no project environment; typecheck is
# separate so a type error cannot hide behind a test failure; test runs the
# three-OS matrix (the Windows leg is load-bearing - the prototype had
# Windows-only path bugs); build proves the wheel actually ships what the
# package claims. The docs job arrives with `checks docs` (#2 -> #11).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Floor and latest stable. Bump the latter when 3.14 releases
        # (October 2026).
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
      - run: uvx twine check dist/*
      - name: assert the wheel ships every package data file
        run: |
          python - <<'EOF'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = (
              "sensor_qaqc/py.typed",
              "sensor_qaqc/layers.toml",
              "sensor_qaqc/check_ids.txt",
              "sensor_qaqc/instruments/sources.yaml",
              "sensor_qaqc/instruments/sensors.yaml",
          )
          missing = [n for n in required if n not in names]
          sys.exit(f"missing from wheel: {missing}" if missing else 0)
          EOF
      - name: install the wheel in a clean venv and run --help
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/sensor-qaqc" --help
      - name: load the catalogues from the installed wheel
        # Shipping the files is not the same as being able to read them: a
        # loader reaching through a path relative to __file__ works in a
        # source checkout and fails here, where a user meets it first (#3).
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          from sensor_qaqc.instruments.sensors import load_sensor_catalogue
          from sensor_qaqc.instruments.sources import load_source_catalogue

          print(sorted(load_sensor_catalogue().products))
          print(sorted(load_source_catalogue().formats))
          EOF

  ci-ok:
    # Fan-in for branch protection: main requires this one context instead of
    # nine job names that silently stop covering the matrix when it changes.
    # ci.yml alone decides what "green" means.
    needs: [lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
