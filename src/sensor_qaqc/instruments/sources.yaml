# File-shape adapters, keyed by export format. Package data, read through
# package resources (#3).
#
# This file says where the timestamp, the value, the unit and the event log
# live. It says nothing about physics: no thresholds, no ranges, no units
# vocabulary - that is sensors.yaml's, and thresholds are injected into checks
# rather than read from anywhere here.
#
# A source is *tables*, not a file: a data table, an optional events table and
# an optional details table, living in the sheets of one workbook or in sibling
# files. `tables` maps the canonical table name onto where that container keeps
# it (#3 plan amendment).
#
# Every entry here is verified against a real export before it lands. The
# hoboconnect_xlsx entry was read off the pristine HOBOconnect export in
# docs/data/ (SHA-256 e5f6676e...). A generic CSV entry arrives with the
# adapter that reads one.

formats:
  hoboconnect_xlsx:
    description: >-
      HOBOconnect workbook export, one series per file. Written by Essential
      XlsIO; the Data sheet holds an int sample number, a naive Excel serial
      timestamp whose zone is declared only in the column header, and the
      value, whose unit is declared only in the column header.
    container: xlsx
    tables:
      data: Data
      events: Events
      details: Details
    data:
      header_row: 1
      sample_number_column: '#'
      # The zone label is captured, never assumed: "PDT" is an abbreviation,
      # not a zone, and the record keeps the export's own declaration.
      timestamp_column: '^Date-Time \((?P<timezone>.+)\)$'
      # "Tidbit 1 , °F" - the series name and the unit, separated by " , ".
      value_column: '^(?P<series>.+) , (?P<unit>.+)$'
      # What the header states for itself. Checked against the patterns above,
      # so a format cannot claim a fact it does not capture - or capture one
      # it did not declare, which would extract a value nobody reviewed.
      header_declares: [timezone, unit]
    events:
      header_row: 1
      sample_number_column: '#'
      timestamp_column: '^Date-Time \((?P<timezone>.+)\)$'
      # One column per event type, and only types that occurred appear, so the
      # column set is dynamic: a fixed-position parser would read the wrong
      # column on any export whose log differs from this one.
      dynamic_columns: true
      marker: Logged
    details:
      # Key/value rows under section headers, one column each. Positions are
      # 1-based, so the same numbers address a workbook column or a CSV field.
      layout: key_value
      section_column: 2
      key_column: 3
      value_column: 4
      # "Series : Tidbit 1 , °F" sits at the outer column, between the
      # deployment sections and the per-series ones. Its remainder has the same
      # shape as the data value header, which makes the unit a fact the export
      # states twice - and so a free checksum on unit handling.
      series_column: 1
      series_prefix: 'Series : '

  hoboconnect_sheets_csv:
    description: >-
      The three sheets of a HOBOconnect workbook written out as sibling CSV
      files - what a spreadsheet's "export as CSV" produces, one file per
      table. The tables are the same tables, so the shapes below are the same
      shapes. This is NOT HOBOconnect's own CSV export: nobody here has an
      app to produce one, so that format is TODO(verify) and would arrive as
      its own entry once a real sample exists.
    container: csv
    # Every stamp in a CSV is text, so the format that reads it is declared
    # rather than inferred. Guessing at a date format is how a day becomes a
    # month for the twelve days of the year where both parse.
    timestamp_format: '%Y-%m-%d %H:%M:%S'
    tables:
      data: data.csv
      events: events.csv
      details: details.csv
    data:
      header_row: 1
      sample_number_column: '#'
      timestamp_column: '^Date-Time \((?P<timezone>.+)\)$'
      value_column: '^(?P<series>.+) , (?P<unit>.+)$'
      header_declares: [timezone, unit]
    events:
      header_row: 1
      sample_number_column: '#'
      timestamp_column: '^Date-Time \((?P<timezone>.+)\)$'
      dynamic_columns: true
      marker: Logged
    details:
      layout: key_value
      section_column: 2
      key_column: 3
      value_column: 4
      series_column: 1
      series_prefix: 'Series : '

  generic_csv:
    description: >-
      A single-series CSV with no vendor metadata: one column named
      "timestamp" and one named "value". The convention is this tool's own,
      not a vendor's - which is the point. A bare CSV asserts nothing, so the
      unit, the zone label, the logging interval and the logger's identity are
      all supplied by an operator and none of them are guessed. Publishing no
      statistics, it also gets no checksum gate, and ingest says so rather
      than letting silence read as a pass.
    container: csv
    timestamp_format: '%Y-%m-%dT%H:%M:%S'
    tables:
      data: data.csv
    data:
      header_row: 1
      # No sample numbering to check against: a bare CSV has no vendor
      # sequence, so a row removed from the middle is undetectable here. That
      # is a real cost of the format, not an oversight.
      sample_number_column: ''
      timestamp_column: '^timestamp$'
      value_column: '^value$'
      header_declares: []
